name: CI

on:
  pull_request:
    branches: [dev, main]

permissions:
  contents: read

jobs:
  test:
    name: Test Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch released mach
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/machdl
          gh release download -R briar-systems/mach \
            -p 'mach-*-x86_64-linux.tar.gz' -D /tmp/machdl --clobber
          tar -xzf /tmp/machdl/mach-*-x86_64-linux.tar.gz -C /tmp/machdl
          install -m 0755 /tmp/machdl/mach /usr/local/bin/mach
          mach info

      - name: Sync dependencies
        run: mach dep pull

      # the device bindings compile into every artifact; mach runs the vendored
      # miniaudio [step.build-miniaudio] and links its object automatically. the
      # tests open no device (miniaudio dlopens backends at run time), so no audio
      # dev packages are needed here.
      - name: Test
        run: mach test .

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch released mach
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/machdl
          gh release download -R briar-systems/mach \
            -p 'mach-*-x86_64-linux.tar.gz' -D /tmp/machdl --clobber
          tar -xzf /tmp/machdl/mach-*-x86_64-linux.tar.gz -C /tmp/machdl
          install -m 0755 /tmp/machdl/mach /usr/local/bin/mach
          mach info

      - name: Sync dependencies
        run: mach dep pull

      # build-verify the device layer: mach runs the vendored miniaudio
      # [step.build-miniaudio], compiles the pure-Mach audio artifact, and links
      # the play example against the step's object and the declared platform
      # libraries. audible playback needs an audio device and is verified off-CI.
      - name: Build
        run: |
          set -euo pipefail
          mach build .
          test -f out/linux-x86_64/debug/obj/miniaudio/miniaudio.o || { echo "::error::[step.build-miniaudio] produced no miniaudio object"; exit 1; }
          test -x out/linux-x86_64/debug/bin/play || { echo "::error::mach build produced no play binary"; exit 1; }
