name: CI

on:
  pull_request:
    branches: [dev, main]

permissions:
  contents: read

jobs:
  test:
    name: Test Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch released mach
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/machdl
          gh release download -R briar-systems/mach \
            -p 'mach-*-x86_64-linux.tar.gz' -D /tmp/machdl --clobber
          tar -xzf /tmp/machdl/mach-*-x86_64-linux.tar.gz -C /tmp/machdl
          install -m 0755 /tmp/machdl/mach /usr/local/bin/mach
          mach info

      - name: Sync dependencies
        run: mach dep pull

      # the device bindings compile into every artifact, so the test suite links
      # the miniaudio shim. miniaudio dlopens the audio backends at run time and
      # the tests open no device, so no audio dev packages are needed here.
      - name: Compile miniaudio shim
        run: make lib

      - name: Test
        run: make test

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch released mach
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/machdl
          gh release download -R briar-systems/mach \
            -p 'mach-*-x86_64-linux.tar.gz' -D /tmp/machdl --clobber
          tar -xzf /tmp/machdl/mach-*-x86_64-linux.tar.gz -C /tmp/machdl
          install -m 0755 /tmp/machdl/mach /usr/local/bin/mach
          mach info

      - name: Sync dependencies
        run: mach dep pull

      # build-verify the device layer: the vendored miniaudio TU compiles and
      # the example links against it and the declared platform libraries.
      # audible playback needs an audio device and is verified off-CI.
      - name: Build
        run: |
          set -euo pipefail
          make build
          test -x out/linux/bin/play || { echo "::error::make build produced no play binary"; exit 1; }
