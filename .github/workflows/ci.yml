name: CI

# the family's tiered pipeline (briar-systems/.github mach-lib.yml). a pull
# request into dev runs the linux leg, a pull request into main runs every leg.
# test/consumer links the library the way an external project does, and the
# per-leg checks on it live in .github/ci. cd.yml calls this with heavy
# all on a tag. nothing runs on push.

on:
  pull_request:
  workflow_call:
    inputs:
      heavy:
        type: string
        default: none
  workflow_dispatch:
    inputs:
      heavy:
        description: heavy work to run on this ref
        type: choice
        default: none
        options: [none, all, windows-cross, x86_64-windows, x86_64-darwin]

permissions:
  contents: read

jobs:
  lib:
    uses: briar-systems/.github/.github/workflows/mach-lib.yml@main
    with:
      heavy: ${{ inputs.heavy }}
      # std 8 requires mach 5.12, ahead of the family pin (briar-systems/.github#103)
      mach-version: v5.12.0
      # each target needs its own toolchain, so the legs below cover them
      all-targets: false
      legs: >-
        [{"name": "x86_64-linux", "runs-on": "ubuntu-latest", "target": "linux-x86_64"},
         {"name": "windows-cross", "runs-on": "ubuntu-latest", "tier": "heavy",
          "target": "windows", "test": false, "apt": ["llvm", "xz-utils"]},
         {"name": "x86_64-windows", "runs-on": "windows-latest", "tier": "heavy",
          "target": "windows"},
         {"name": "x86_64-darwin", "runs-on": "macos-15-intel", "tier": "heavy",
          "target": "darwin"}]
      subprojects: '[{"path": "test/consumer", "build": true, "test": false}]'

  gate:
    if: always()
    needs: [lib]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: briar-systems/.github/.github/actions/gate@main
        with:
          needs: ${{ toJSON(needs) }}
