[project]
id      = "audio"
version = "0.11.0"
mach    = "^7"
src     = "src"
work    = "out/{target.name}/{profile.name}"

[target.linux-x86_64]
arch = "x86_64"
sys  = "linux"
env  = "gnu"
abi  = "sysv64"

[target.linux-arm64]
arch = "aarch64"
sys  = "linux"
env  = "gnu"
abi  = "aapcs64"

[target.windows]
arch = "x86_64"
sys  = "windows"
abi  = "win64"

[target.darwin]
arch = "x86_64"
sys  = "darwin"
abi  = "sysv64"

[target.darwin-aarch64]
arch = "aarch64"
sys  = "darwin"
abi  = "darwinpcs"

[profile.debug]
default = true
optimize = false
debug = true
simd = "scalarize"

[profile.release]
optimize = true
debug = false
simd = "scalarize"

[artifact.audio]
kind    = "static"
entry   = "lib/audio.mach"
out     = "{project.work}/lib/libaudio{artifact.suffix}"
default = true
export  = true
targets = ["*"]
link    = [
    "miniaudio-local", "mingw32", "compiler-rt",
    "c", "pthread", "m", "dl", "rt",
    "kernel32", "ucrt-heap", "ucrt-string", "ucrt-stdio",
    "libSystem", "CoreFoundation", "CoreAudio", "AudioToolbox",
]
need    = []

[link.miniaudio-local]
source = "local"
path   = "{project.work}/vendor/miniaudio/miniaudio.o"
sys    = ["linux", "windows", "darwin"]
arch   = ["*"]
abi    = ["*"]
export = true

[link.mingw32]
source = "local"
path   = "{project.work}/vendor/miniaudio/mingw/libmingw32.lib"
sys    = ["windows"]
arch   = ["*"]
abi    = ["*"]
export = true

[link.compiler-rt]
source = "local"
path   = "{project.work}/vendor/miniaudio/mingw/compiler_rt.lib"
sys    = ["windows"]
arch   = ["*"]
abi    = ["*"]
export = true

# miniaudio's C object calls the C library directly, so it is named rather than
# reached through another library's own dependencies
[link.c]
source = "system"
name   = "c"
sys    = ["linux"]
arch   = ["*"]
abi    = ["*"]
export = true

[link.pthread]
source = "system"
name   = "pthread"
sys    = ["linux"]
arch   = ["*"]
abi    = ["*"]
export = true

[link.m]
source = "system"
name   = "m"
sys    = ["linux"]
arch   = ["*"]
abi    = ["*"]
export = true

[link.dl]
source = "system"
name   = "dl"
sys    = ["linux"]
arch   = ["*"]
abi    = ["*"]
export = true

[link.rt]
source = "system"
name   = "rt"
sys    = ["linux"]
arch   = ["*"]
abi    = ["*"]
export = true

[link.kernel32]
source = "system"
name   = "kernel32.dll"
symbols = [
    "CloseHandle", "CreateEventA", "CreateSemaphoreA", "CreateThread",
    "FreeLibrary", "GetLastError", "GetProcAddress", "LoadLibraryA",
    "QueryPerformanceCounter", "QueryPerformanceFrequency",
    "ReleaseSemaphore", "ResetEvent", "SetEvent", "SetThreadPriority",
    "Sleep", "WaitForSingleObject", "WideCharToMultiByte",
]
sys    = ["windows"]
arch   = ["*"]
abi    = ["*"]
export = true

[link.ucrt-heap]
source = "system"
name   = "api-ms-win-crt-heap-l1-1-0.dll"
symbols = ["malloc", "free", "realloc"]
sys    = ["windows"]
arch   = ["*"]
abi    = ["*"]
export = true

[link.ucrt-string]
source = "system"
name   = "api-ms-win-crt-string-l1-1-0.dll"
symbols = ["wcslen"]
sys    = ["windows"]
arch   = ["*"]
abi    = ["*"]
export = true

[link.ucrt-stdio]
source = "system"
name   = "api-ms-win-crt-stdio-l1-1-0.dll"
symbols = ["__stdio_common_vsprintf"]
sys    = ["windows"]
arch   = ["*"]
abi    = ["*"]
export = true

[link.libSystem]
source = "system"
name   = "/usr/lib/libSystem.B.dylib"
symbols = [
    "___chkstk_darwin", "__chkstk_darwin", "__assert_rtn", "__bzero", "bzero",
    "__stack_chk_fail", "__stack_chk_guard", "clock_gettime", "exp", "free",
    "gettimeofday", "mach_absolute_time", "malloc", "memcpy", "memset",
    "pthread_attr_destroy", "pthread_attr_getschedparam", "pthread_attr_init",
    "pthread_attr_setinheritsched", "pthread_attr_setschedparam",
    "pthread_attr_setschedpolicy", "pthread_attr_setstacksize",
    "pthread_cond_broadcast", "pthread_cond_destroy", "pthread_cond_init",
    "pthread_cond_signal", "pthread_cond_wait", "pthread_create",
    "pthread_join", "pthread_mutex_destroy", "pthread_mutex_init",
    "pthread_mutex_lock", "pthread_mutex_unlock", "realloc",
    "sched_get_priority_max", "sched_get_priority_min", "select", "select$1050",
    "sin", "strcmp", "strlen", "usleep", "vsnprintf",
]
sys    = ["darwin"]
arch   = ["*"]
abi    = ["*"]
export = true

[link.CoreFoundation]
source = "framework"
name   = "CoreFoundation"
symbols = ["CFRelease", "CFStringGetCString"]
sys    = ["darwin"]
arch   = ["*"]
abi    = ["*"]
export = true

[link.CoreAudio]
source = "framework"
name   = "CoreAudio"
symbols = [
    "AudioObjectAddPropertyListener", "AudioObjectGetPropertyData",
    "AudioObjectGetPropertyDataSize", "AudioObjectRemovePropertyListener",
    "AudioObjectSetPropertyData",
]
sys    = ["darwin"]
arch   = ["*"]
abi    = ["*"]
export = true

[link.AudioToolbox]
source = "framework"
name   = "AudioToolbox"
symbols = [
    "AudioComponentFindNext", "AudioComponentInstanceDispose",
    "AudioComponentInstanceNew", "AudioOutputUnitStart", "AudioOutputUnitStop",
    "AudioUnitAddPropertyListener", "AudioUnitGetProperty",
    "AudioUnitGetPropertyInfo", "AudioUnitInitialize", "AudioUnitRender",
    "AudioUnitSetProperty",
]
sys    = ["darwin"]
arch   = ["*"]
abi    = ["*"]
export = true

[step.build-miniaudio]
argv = ["sh", "tools/build-miniaudio.sh", "{project.work}/vendor/miniaudio/miniaudio.o"]
in   = ["tools/build-miniaudio.sh", "vendor/mad.c", "vendor/miniaudio.h"]
out  = ["{project.work}/vendor/miniaudio/miniaudio.o"]
need = []

[step.mingw-runtime]
argv = [
    "sh", "tools/materialize-mingw-runtime.sh",
    "{project.work}/vendor/miniaudio/mingw/libmingw32.lib",
    "{project.work}/vendor/miniaudio/mingw/compiler_rt.lib",
]
in   = ["tools/materialize-mingw-runtime.sh"]
out  = [
    "{project.work}/vendor/miniaudio/mingw/libmingw32.lib",
    "{project.work}/vendor/miniaudio/mingw/compiler_rt.lib",
]
need = []

[dep.std]
git = "https://github.com/briar-systems/mach-std"
ref = "branch/dev"
