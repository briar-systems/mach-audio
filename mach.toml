[project]
id          = "audio"
name        = "Mach Audio Library"
description = "Mach audio playback and decoding library"
version     = "0.2.0"
src         = "src"
out         = "out/{target.name}/{profile.name}"

[target.linux-x86_64]
isa = "x86_64"
os  = "linux"
abi = "sysv64"

[target.windows]
isa = "x86_64"
os  = "windows"
abi = "win64"

[target.darwin]
isa = "x86_64"
os  = "darwin"
abi = "sysv64"

[profile.debug]
opt = 0

[profile.release]
opt = 2

[artifact.audio]
kind    = "static"
entry   = "audio.mach"
out     = "lib/audio"
targets = ["*"]
link    = ["miniaudio-local", "pthread", "m", "dl", "rt", "ole32"]

[artifact.play]
kind    = "bin"
entry   = "play.mach"
out     = "bin/play"
targets = ["*"]
link    = ["miniaudio-local", "pthread", "m", "dl", "rt", "ole32"]

[link.miniaudio-local]
source = "local"
path   = "{project.out}/obj/miniaudio/miniaudio.o"
os     = ["linux"]
export = true

[link.pthread]
source = "system"
name   = "pthread"
os     = ["linux"]
export = true

[link.m]
source = "system"
name   = "m"
os     = ["linux"]
export = true

[link.dl]
source = "system"
name   = "dl"
os     = ["linux"]
export = true

[link.rt]
source = "system"
name   = "rt"
os     = ["linux"]
export = true

[link.ole32]
source = "system"
name   = "ole32.dll"
os     = ["windows"]
export = true

[step.build-miniaudio]
cmd = "mkdir -p {project.out}/obj/miniaudio && cc -c -O2 -fPIC -w vendor/mad.c -o {project.out}/obj/miniaudio/miniaudio.o"
in  = ["vendor/mad.c", "vendor/miniaudio.h"]
out = ["{project.out}/obj/miniaudio/miniaudio.o"]

[dep.mach-std]
git = "https://github.com/briar-systems/mach-std"
ref = "branch/main"
