[project]
id      = "audio"
version = "0.1.0"
module  = "audio.mach"
target  = "native"
src     = "src"
dep     = "dep"
out     = "out/{target}/bin/{name}{ext}"
obj     = "out/{target}/obj"

[target.linux]
isa = "x86_64"
os  = "linux"
abi = "sysv64"

[target.windows]
isa = "x86_64"
os  = "windows"
abi = "win64"
ext = ".exe"

[target.darwin]
isa = "x86_64"
os  = "darwin"
abi = "sysv64"

# the vendored miniaudio device shim, built by the Makefile into
# libminiaudio.so and linked by name, cascaded to every consumer the way
# mach-glfw declares its native GLFW dependency. the .so carries miniaudio's own
# libc/pthread/dl/m dependencies and loads the actual backends (ALSA,
# PulseAudio, JACK, PipeWire) at run time via dlopen, so nothing else is needed
# at link time. builds must see it on the library path (`mach build . -L build`,
# or install it); running needs it on the loader path.
[os.linux]
libs = ["miniaudio"]

# WASAPI and the other Windows backends reach the audio APIs through COM. the
# miniaudio shim itself (miniaudio.dll) is declared intent: cross-building it is
# future work, so only the COM requirement is stated here.
[os.windows]
libs = ["ole32.dll"]

# CoreAudio playback needs the CoreAudio, AudioToolbox, and CoreFoundation
# frameworks, plus a darwin build of the shim. `-framework` linking is not yet
# expressible in mach.toml, so the darwin device layer is declared intent; the
# pure-mach layer still builds for darwin.
[os.darwin]
libs = []

[lib.audio]
entry = "audio.mach"

[bin.play]
entry = "play.mach"

[deps.mach-std]
git = "https://github.com/briar-systems/mach-std"
ref = "branch/main"
