[project]
id = "audio_consumer"
version = "0.0.0"
mach = "^7"
src = "src"
work = "out/{target.name}/{profile.name}"

[target.linux-x86_64]
arch = "x86_64"
sys = "linux"
env = "gnu"
abi = "sysv64"

[target.linux-arm64]
arch = "aarch64"
sys = "linux"
env = "gnu"
abi = "aapcs64"

[target.windows]
arch = "x86_64"
sys = "windows"
abi = "win64"

[target.darwin]
arch = "x86_64"
sys = "darwin"
abi = "sysv64"

[target.darwin-aarch64]
arch = "aarch64"
sys = "darwin"
abi = "darwinpcs"

[profile.debug]
default = true
optimize = false
debug = true
simd = "scalarize"

[profile.release]
optimize = true
debug = false
simd = "scalarize"

[artifact.audio-consumer]
kind = "bin"
entry = "main.mach"
out = "{project.work}/bin/audio-consumer{artifact.suffix}"
targets = ["*"]
link = []
need = []

[dep.audio]
path = "../.."

[dep.std]
git = "https://github.com/briar-systems/mach-std"
ref = "branch/dev"
